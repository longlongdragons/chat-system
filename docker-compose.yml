version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      SERVER_ID: "api-1"
      JWT_PRIVATE_KEY: "/app/secrets/jwt_rsa.pem"
      JWT_PUBLIC_KEY:  "/app/secrets/jwt_rsa.pub.pem"
      ALLOWED_ORIGINS: "http://localhost:5173"
      PUBLIC_BASE_URL: "http://localhost:8080"
      UPLOAD_DIR: "/app/data/uploads"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin123456"
    ports: ["8080:8080"]
    volumes:
      - ./secrets:/app/secrets
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  gateway-1:
    build: ./backend
    command: ["/app/gateway"]
    environment:
      WS_ADDR: ":8081"
      DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      SERVER_ID: "gw-1"
      JWT_PRIVATE_KEY: "/app/secrets/jwt_rsa.pem"
      JWT_PUBLIC_KEY:  "/app/secrets/jwt_rsa.pub.pem"
      ALLOWED_ORIGINS: "http://localhost:5173"
    ports: ["8081:8081"]
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  gateway-2:
    build: ./backend
    command: ["/app/gateway"]
    environment:
      WS_ADDR: ":8081"
      DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      SERVER_ID: "gw-2"
      JWT_PRIVATE_KEY: "/app/secrets/jwt_rsa.pem"
      JWT_PUBLIC_KEY:  "/app/secrets/jwt_rsa.pub.pem"
      ALLOWED_ORIGINS: "http://localhost:5173"
    ports: ["8082:8081"]
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads: