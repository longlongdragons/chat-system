# 生产编排：使用发布到 Docker Hub 的预构建镜像（把 <DOCKERHUB_USER> 换成你的账号）
# 与开发版 docker-compose.yml 的差别：不现场构建，直接拉镜像；前端由 nginx 容器托管
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${DOCKERHUB_USER}/chat-api:latest
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      SERVER_ID: "api-1"
      JWT_PRIVATE_KEY: "/app/secrets/jwt_rsa.pem"
      JWT_PUBLIC_KEY:  "/app/secrets/jwt_rsa.pub.pem"
      ALLOWED_ORIGINS: "http://localhost"
      PUBLIC_BASE_URL: "http://localhost:8080"
      UPLOAD_DIR: "/app/data/uploads"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin123456"
    ports: ["8080:8080"]
    volumes:
      - ./secrets:/app/secrets
      - uploads:/app/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  gateway:
    image: ${DOCKERHUB_USER}/chat-gateway:latest
    environment:
      WS_ADDR: ":8081"
      DATABASE_URL: "postgres://chat:chat@postgres:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      SERVER_ID: "gw-1"
      JWT_PRIVATE_KEY: "/app/secrets/jwt_rsa.pem"
      JWT_PUBLIC_KEY:  "/app/secrets/jwt_rsa.pub.pem"
      ALLOWED_ORIGINS: "http://localhost"
    ports: ["8081:8081"]
    volumes:
      - ./secrets:/app/secrets
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  frontend:
    image: ${DOCKERHUB_USER}/chat-frontend:latest
    ports: ["80:80"]
    depends_on:
      - api
      - gateway

volumes:
  pgdata:
  redisdata:
  uploads:
